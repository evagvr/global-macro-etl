services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  etl:
    build: .
    command: tail -f /dev/null
    depends_on:
      - db
    volumes:
      - ./src:/app/src
    env_file:
      - .env
volumes:
  pg_data: